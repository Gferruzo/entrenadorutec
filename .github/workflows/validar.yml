name: Validar cursos
on:
  push:
    paths: ["cursos/**", "tools/validar.py"]
  pull_request:
    paths: ["cursos/**", "tools/validar.py"]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validar.py
